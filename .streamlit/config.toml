[theme]
base = "light"
primaryColor = "#00742A"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1D1A"
linkColor = "#00742A"
borderColor = "#E2E0D8"
showWidgetBorder = true
baseRadius = "6px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#1f6fbf", "#d9630c", "#13906b", "#7a3e8f"]

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
enableStaticServing = false

[browser]
gatherUsageStats = false
